<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Universal Remote</title>
<!--
  Universal Remote custom Cast receiver (app ID D66B7719).

  One page, one visible mode at a time:
    idle    – branded "ready to cast" screen
    mirror  – iPhone screen mirroring. The iPhone sends {"type":"START","url":"http://<phone>:8080/…/live.mp4"}
              on urn:x-cast:com.screenmirror; the endless fragmented MP4 goes straight into Media Source
              Extensions and stays a fraction of a second behind live. {"type":"STOP"} ends it.
    photo   – Cast LOAD with an image/* content type (custom full-screen viewer)
    audio   – Cast LOAD with an audio/* content type (custom now-playing screen)
    video   – Cast LOAD with any other content type (cast-media-player + title overlay)
    web     – {"type":"WEB","url":"https://…","title":"…"} shows the page full screen
              (some sites refuse to be framed and stay blank).

  Desktop test: receiver.html?src=http://<phone>:8080/live.mp4&lag=0.1&stats
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root {
    --accent: #3EA2F3;
    --bg: #05070B;
    --text: #FFFFFF;
    --muted: rgba(255,255,255,0.55);
    --font: "Google Sans", "Roboto", system-ui, -apple-system, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); font-family: var(--font); }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
  .layer.visible { opacity: 1; visibility: visible; transition: opacity .45s ease; }

  /* ---------- Idle ---------- */
  #idle { display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at 50% 35%, #12304d 0%, #08111c 45%, var(--bg) 80%); }
  .rings { position: relative; width: 300px; height: 300px; margin-bottom: 56px; }
  .rings span { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(62,162,243,.45); animation: ripple 3.6s ease-out infinite; }
  .rings span:nth-child(2) { animation-delay: 1.2s; } .rings span:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple { from { transform: scale(.45); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  .logo { position: absolute; inset: 75px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center;
          box-shadow: 0 0 80px rgba(62,162,243,.55); }
  .logo svg { width: 72px; height: 72px; }
  #idle h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: .5px; }
  #idle p { margin: 18px 0 0; font-size: 28px; color: var(--muted); }
  #clock { position: absolute; top: 48px; right: 64px; font-size: 40px; font-weight: 500; color: var(--muted); }

  /* ---------- Mirror ---------- */
  #mirror { background: #000; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #message { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; color: #9a9a9a; font: 28px/1.4 var(--font); }
  #stats { position: absolute; top: 16px; right: 24px; color: #6f6; font: 16px monospace; display: none; }

  /* ---------- Media (cast-media-player) ---------- */
  #media { background: #000; }
  cast-media-player { position: absolute; inset: 0; --background-color: #000; --theme-hue: 210; --progress-color: var(--accent); --font-family: var(--font); }

  /* ---------- Photo ---------- */
  #photo { background: #000; overflow: hidden; }
  #photoBlur { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(48px) brightness(.45); transform: scale(1.1); }
  #photoImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transform: scale(1.03); transition: opacity .6s ease, transform 6s ease-out; }
  #photoImg.shown { opacity: 1; transform: scale(1); }

  /* ---------- Audio ---------- */
  #audio { display: flex; align-items: center; justify-content: center; gap: 96px;
           background: radial-gradient(ellipse at 30% 40%, #173a5c 0%, #0a1420 50%, var(--bg) 85%); }
  .art { width: 420px; height: 420px; border-radius: 36px; background: linear-gradient(135deg, #3EA2F3, #1b4f9c 60%, #10223d);
         display: flex; align-items: center; justify-content: center; box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 90px rgba(62,162,243,.25); }
  .art svg { width: 170px; height: 170px; opacity: .95; }
  .now { width: 760px; }
  .now .label { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  #audioTitle { margin: 16px 0 6px; font-size: 64px; font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #audioArtist { font-size: 30px; color: var(--muted); }
  .eq { display: flex; align-items: flex-end; gap: 10px; height: 64px; margin: 44px 0 36px; }
  .eq span { width: 12px; height: 16px; border-radius: 6px; background: var(--accent); }
  .eq.playing span { animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: .15s; } .eq span:nth-child(3) { animation-delay: .35s; }
  .eq span:nth-child(4) { animation-delay: .05s; } .eq span:nth-child(5) { animation-delay: .25s; }
  @keyframes eq { 0%,100% { height: 14px; } 50% { height: 64px; } }

  /* Shared progress bar (audio + video) */
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .5s linear; }
  .times { display: flex; justify-content: space-between; margin-top: 14px; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Video title overlay ---------- */
  #videoTop { position: absolute; left: 0; right: 0; top: 0; padding: 48px 72px 120px; background: linear-gradient(rgba(0,0,0,.75), transparent);
              opacity: 0; transition: opacity .5s ease; pointer-events: none; z-index: 5; }
  #videoTop.shown { opacity: 1; }
  #videoTitle { font-size: 42px; font-weight: 600; }
  .brand { font-size: 24px; color: var(--muted); margin-top: 6px; }

  /* ---------- Badges ---------- */
  .pill { position: absolute; top: 44px; left: 56px; display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 40px;
          background: rgba(0,0,0,.55); font-size: 24px; font-weight: 600; letter-spacing: 1px; transition: opacity .6s ease; z-index: 5; }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: #ff3b30; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* ---------- Web ---------- */
  #web { background: #fff; }
  #webBar { position: absolute; left: 0; right: 0; top: 0; height: 72px; padding: 0 40px; display: flex; align-items: center; gap: 18px;
            background: #0b1220; color: #fff; font-size: 26px; z-index: 2; }
  #webBar svg { width: 30px; height: 30px; flex: none; }
  #webTitle { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  #webBar .brand { margin: 0; }
  #webFrame { position: absolute; left: 0; right: 0; top: 72px; bottom: 0; width: 100%; height: calc(100% - 72px); border: 0; background: #fff; }
  #webLoading { position: absolute; inset: 72px 0 0 0; display: flex; align-items: center; justify-content: center; background: #0b1220; z-index: 1; }
  .spinner { width: 72px; height: 72px; border-radius: 50%; border: 6px solid rgba(255,255,255,.15); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #webHint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 14px 28px; border-radius: 30px; background: rgba(11,18,32,.9);
             color: #fff; font-size: 22px; opacity: 0; transition: opacity .6s ease; z-index: 3; white-space: nowrap; }
  #webHint.shown { opacity: 1; }
</style>
</head>
<body>

<!-- Idle -->
<div id="idle" class="layer visible">
  <div id="clock"></div>
  <div class="rings"><span></span><span></span><span></span>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2C12 14.92 7.07 10 1 10z"/></svg>
    </div>
  </div>
  <h1>Universal Remote</h1>
  <p id="idleText">Ready to cast — choose Photos, Videos, Audio, Web or Screen Mirroring on your iPhone</p>
</div>

<!-- Screen mirroring -->
<div id="mirror" class="layer">
  <video id="video" muted autoplay playsinline></video>
  <div class="pill" id="livePill"><i></i>LIVE · iPhone</div>
  <div id="message"></div>
  <div id="stats"></div>
</div>

<!-- Photos / videos / audio (Cast media player) -->
<div id="media" class="layer">
  <cast-media-player id="player"></cast-media-player>
  <div id="videoTop"><div id="videoTitle"></div><div class="brand">Universal Remote</div></div>
</div>

<!-- Photo viewer -->
<div id="photo" class="layer">
  <div id="photoBlur"></div>
  <img id="photoImg" alt="">
</div>

<!-- Audio now playing -->
<div id="audio" class="layer">
  <div class="art"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
  <div class="now">
    <div class="label">Now playing</div>
    <div id="audioTitle">Audio</div>
    <div id="audioArtist">Universal Remote</div>
    <div class="eq" id="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bar"><div id="audioProgress"></div></div>
    <div class="times"><span id="audioNow">0:00</span><span id="audioEnd">0:00</span></div>
  </div>
</div>

<!-- Web page -->
<div id="web" class="layer">
  <div id="webBar">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3EA2F3" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    <div id="webTitle"></div>
    <div class="brand">Universal Remote · Web Cast</div>
  </div>
  <div id="webLoading"><div class="spinner"></div></div>
  <iframe id="webFrame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
  <div id="webHint">If the page stays blank, this website doesn't allow being shown on a TV.</div>
</div>

<script>
const NAMESPACE = 'urn:x-cast:com.screenmirror';

// Playback stays this far (seconds) behind the newest buffered frame. The sender picks it in
// START as "lag": a per-frame stream can sit at about 0.1 s, a stream of half-second segments
// needs 0.6 s or it stalls between segments. The other thresholds scale from it.
const DEFAULT_LAG = 0.6;
let targetLag = DEFAULT_LAG;  // where a jump lands
let speedupLag = 1.1;         // above this, play slightly fast to catch up
let jumpLag = 2.0;            // above this, jump straight to targetLag
const KEEP_BEHIND = 4;        // seconds of already-played video kept in the buffer

function setLag(lag) {
  targetLag = lag > 0 && lag < 5 ? lag : DEFAULT_LAG;
  speedupLag = targetLag + Math.max(0.08, targetLag * 0.6);
  jumpLag = targetLag + Math.max(0.6, targetLag * 2.3);
}

const video = document.getElementById('video');
const message = document.getElementById('message');
const stats = document.getElementById('stats');
const params = new URLSearchParams(location.search);
if (params.has('stats')) stats.style.display = 'block';

let session = 0;
let current = null; // { id, reader, mediaSource, sourceBuffer, queue }
let context = null;
let reportedPlaying = false;

// Tells connected senders what the player is doing: CONNECTING, PLAYING or RECONNECTING.
function report(state) {
  if (!context) return;
  try { context.sendCustomMessage(NAMESPACE, undefined, { type: 'STATE', state }); } catch (e) {}
}

function show(text) {
  message.textContent = text;
  message.style.display = text ? 'block' : 'none';
}

function concat(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

// Reads the H.264 codec string ("avc1.PPCCLL") from the avcC box of the init segment.
function codecFrom(bytes) {
  for (let i = 0; i + 8 < bytes.length; i++) {
    if (bytes[i] === 0x61 && bytes[i + 1] === 0x76 && bytes[i + 2] === 0x63 && bytes[i + 3] === 0x43) {
      const hex = (n) => n.toString(16).padStart(2, '0').toUpperCase();
      return 'avc1.' + hex(bytes[i + 5]) + hex(bytes[i + 6]) + hex(bytes[i + 7]);
    }
  }
  return null;
}

function stop() {
  session++;
  if (current) {
    try { current.reader.cancel(); } catch (e) {}
    current = null;
  }
  video.removeAttribute('src');
  video.load();
}

async function start(url) {
  stop();
  const id = session;
  reportedPlaying = false;
  show('Connecting to iPhone…');
  report('CONNECTING');

  try {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const reader = response.body.getReader();

    // Read until the init segment has told us the codec.
    let head = new Uint8Array(0);
    let codec = null;
    while (!codec) {
      const { value, done } = await reader.read();
      if (done) throw new Error('stream ended');
      head = concat(head, value);
      codec = codecFrom(head) || (head.length > 65536 ? 'avc1.64001F' : null);
    }
    if (id !== session) return reader.cancel();

    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    await new Promise((resolve) => mediaSource.addEventListener('sourceopen', resolve, { once: true }));
    if (id !== session) return reader.cancel();

    const sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="' + codec + '"');
    sourceBuffer.mode = 'segments';
    const queue = [head];
    current = { id, reader, mediaSource, sourceBuffer, queue };

    let lastTrim = 0;
    const pump = () => {
      if (id !== session || sourceBuffer.updating) return;
      // Frames arrive ~30 times a second, so the buffer is rarely idle: trim in the gaps.
      if (!queue.length) {
        if (performance.now() - lastTrim > 2000) { lastTrim = performance.now(); trim(false); }
        return;
      }
      const chunk = queue.shift();
      try {
        sourceBuffer.appendBuffer(chunk);
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          queue.unshift(chunk);
          trim(true);
        } else {
          throw e;
        }
      }
    };
    sourceBuffer.addEventListener('updateend', pump);
    pump();

    for (;;) {
      const { value, done } = await reader.read();
      if (done || id !== session) break;
      queue.push(value);
      pump();
    }
    if (id === session) retry(url, 'Stream ended');
  } catch (e) {
    if (id === session) retry(url, e.message || String(e));
  }
}

function retry(url, reason) {
  const id = session;
  show('Reconnecting… (' + reason + ')');
  reportedPlaying = false;
  report('RECONNECTING');
  setTimeout(() => { if (id === session) start(url); }, 1000);
}

// Drops video that has already been played so the buffer stays small on the TV.
function trim(force) {
  const sb = current && current.sourceBuffer;
  if (!sb || sb.updating || !video.buffered.length) return;
  const start = video.buffered.start(0);
  const cutoff = video.currentTime - (force ? 1 : KEEP_BEHIND);
  if (cutoff > start + 1) {
    try { sb.remove(start, cutoff); } catch (e) {}
  }
}

// Keeps playback just behind the newest frame.
setInterval(() => {
  const buffered = video.buffered;
  if (!buffered.length) return;
  const end = buffered.end(buffered.length - 1);
  const lastStart = buffered.start(buffered.length - 1);
  let lag = end - video.currentTime;

  if (video.currentTime < lastStart || lag > jumpLag) {
    video.currentTime = Math.max(lastStart, end - targetLag);
    lag = end - video.currentTime;
  }
  const rate = lag > speedupLag ? 1.1 : 1.0;
  if (video.playbackRate !== rate) video.playbackRate = rate;
  if (video.paused) video.play().catch(() => {});
  if (video.currentTime > 0 && !video.paused && !reportedPlaying) {
    reportedPlaying = true;
    show('');
    report('PLAYING');
  }

  stats.textContent = 'lag ' + lag.toFixed(2) + 's  rate ' + rate.toFixed(2) +
    '  buf ' + (end - buffered.start(0)).toFixed(1) + 's';
}, 50);

// =====================================================================================
//  Universal Remote: modes, media screens, web cast
// =====================================================================================
const layers = {
  idle: document.getElementById('idle'),
  mirror: document.getElementById('mirror'),
  media: document.getElementById('media'),
  photo: document.getElementById('photo'),
  audio: document.getElementById('audio'),
  web: document.getElementById('web'),
};
const livePill = document.getElementById('livePill');
const photoImg = document.getElementById('photoImg');
const photoBlur = document.getElementById('photoBlur');
const audioTitle = document.getElementById('audioTitle');
const audioProgress = document.getElementById('audioProgress');
const audioNow = document.getElementById('audioNow');
const audioEnd = document.getElementById('audioEnd');
const eq = document.getElementById('eq');
const videoTop = document.getElementById('videoTop');
const videoTitle = document.getElementById('videoTitle');
const webFrame = document.getElementById('webFrame');
const webTitle = document.getElementById('webTitle');
const webLoading = document.getElementById('webLoading');
const webHint = document.getElementById('webHint');
const clock = document.getElementById('clock');

let mode = 'idle';
let mediaKind = null;      // 'photo' | 'audio' | 'video'
let pillTimer = null, videoTopTimer = null, webHintTimer = null;

// photo / audio / video all keep the Cast player running underneath (it owns the LOAD);
// photo and audio cover it with their own full-screen design.
function setMode(next) {
  mode = next;
  const visible = {
    idle: next === 'idle',
    mirror: next === 'mirror',
    media: next === 'photo' || next === 'audio' || next === 'video',
    photo: next === 'photo',
    audio: next === 'audio',
    web: next === 'web',
  };
  for (const key in layers) layers[key].classList.toggle('visible', visible[key]);
  if (next !== 'web') { webFrame.removeAttribute('src'); webHint.classList.remove('shown'); }
  if (next !== 'mirror') show('');
  if (next === 'mirror') flashPill();
  if (next !== 'video') videoTop.classList.remove('shown');
}

function flashPill() {
  livePill.style.opacity = '1';
  clearTimeout(pillTimer);
  pillTimer = setTimeout(() => { livePill.style.opacity = '0'; }, 5000);
}

function stopMedia() {
  try {
    const pm = context && context.getPlayerManager();
    if (pm && pm.getPlayerState() !== cast.framework.messages.PlayerState.IDLE) pm.stop();
  } catch (e) {}
}

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const s = Math.floor(sec % 60), m = Math.floor(sec / 60) % 60, h = Math.floor(sec / 3600);
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

function titleOf(media) {
  const meta = media && media.metadata;
  if (meta && meta.title) return meta.title;
  const url = media && (media.contentUrl || media.contentId) || '';
  return decodeURIComponent(url.split('/').pop().split('?')[0] || 'Media');
}

function kindOf(media) {
  const type = (media && media.contentType || '').toLowerCase();
  if (type.startsWith('image/')) return 'photo';
  if (type.startsWith('audio/')) return 'audio';
  return 'video';
}

function showPhoto(url) {
  photoImg.classList.remove('shown');
  photoImg.onload = () => setTimeout(() => photoImg.classList.add('shown'), 30);
  photoImg.src = url;
  if (photoImg.complete && photoImg.naturalWidth) photoImg.onload();   // already cached
  photoBlur.style.backgroundImage = 'url("' + url + '")';
}

function showVideoTitle(keep) {
  videoTop.classList.add('shown');
  clearTimeout(videoTopTimer);
  if (!keep) videoTopTimer = setTimeout(() => videoTop.classList.remove('shown'), 4000);
}

function openWeb(url, title) {
  webTitle.textContent = title || url.replace(/^https?:\/\//, '').split('/')[0];
  webLoading.style.display = 'flex';
  webHint.classList.remove('shown');
  clearTimeout(webHintTimer);
  webFrame.onload = () => {
    webLoading.style.display = 'none';
    webHint.classList.add('shown');
    webHintTimer = setTimeout(() => webHint.classList.remove('shown'), 7000);
  };
  webFrame.src = url;
}

// Clock on the idle screen
function tick() {
  const d = new Date();
  clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
tick(); setInterval(tick, 10000);

// Progress / state for the audio and video screens
setInterval(() => {
  if (!context || (mode !== 'audio' && mode !== 'video')) return;
  const pm = context.getPlayerManager();
  const now = pm.getCurrentTimeSec(), total = pm.getDurationSec();
  const state = pm.getPlayerState();
  const playing = state === cast.framework.messages.PlayerState.PLAYING;

  if (mode === 'audio') {
    audioProgress.style.width = (total > 0 ? Math.min(100, now / total * 100) : 0) + '%';
    audioNow.textContent = fmt(now);
    audioEnd.textContent = fmt(total);
    eq.classList.toggle('playing', playing);
  } else if (!playing) {
    showVideoTitle(true);   // keep the title visible while paused / buffering
  } else if (videoTop.classList.contains('shown') && !videoTopTimer) {
    showVideoTitle(false);
  }
}, 500);

if (params.has('src')) {
  setLag(parseFloat(params.get('lag')));
  setMode('mirror');
  start(params.get('src'));
} else if (window.cast && cast.framework) {
  context = cast.framework.CastReceiverContext.getInstance();
  const playerManager = context.getPlayerManager();

  // ---- Mirror + Web Cast (custom namespace) ----
  context.addCustomMessageListener(NAMESPACE, (event) => {
    const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    if (data.type === 'START' && data.url) {
      stopMedia(); setMode('mirror');
      setLag(parseFloat(data.lag)); start(data.url);
    }
    if (data.type === 'STOP') { stop(); stopMedia(); setMode('idle'); }
    if (data.type === 'WEB' && data.url) {
      stop(); stopMedia();
      setMode('web');
      openWeb(data.url, data.title);
    }
  });

  // ---- Photos / videos / audio (normal Cast LOAD) ----
  playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
    stop();                                   // end any mirror
    const media = request.media || {};
    mediaKind = kindOf(media);
    setMode(mediaKind);
    if (mediaKind === 'photo') showPhoto(media.contentUrl || media.contentId);
    if (mediaKind === 'audio') {
      audioTitle.textContent = titleOf(media);
      audioProgress.style.width = '0%';
      audioNow.textContent = '0:00'; audioEnd.textContent = '0:00';
    }
    if (mediaKind === 'video') { videoTitle.textContent = titleOf(media); videoTopTimer = null; showVideoTitle(false); }
    return request;
  });

  // Stop Casting in the app / media finished → back to the ready screen
  playerManager.addEventListener(cast.framework.events.EventType.REQUEST_STOP, () => {
    if (mode === 'photo' || mode === 'audio' || mode === 'video') setMode('idle');
  });
  playerManager.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => {
    if (mode === 'audio' || mode === 'video') setMode('idle');
  });
  // Seeking / pausing a video brings the title back briefly
  playerManager.addEventListener(cast.framework.events.EventType.SEEKED, () => {
    if (mode === 'video') { videoTopTimer = null; showVideoTitle(false); }
  });

  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
  context.start(options);
}
</script>
</body>
